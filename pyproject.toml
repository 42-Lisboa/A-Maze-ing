[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE.md"]
readme = "a_maze_gen/README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "flake8>=7.4.0",
    "mypy>=2.4.1",
    "pydantic>=2.14.3"
]

[tool.setuptools]
packages = ["a_maze_gen"]
